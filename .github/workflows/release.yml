# GitHub Actions — quick task 260913-rp5 (option 2 split).
#
# Builds Colonoscopist on every pushed tag (vX.Y.Z) and ships the
# NSIS + portable installers + latest.yml manifest to a SEPARATE
# public release repo (`hussienessam04/colonoscopist-releases`).
# The source repo stays private — end users consume updates without
# ever seeing the code.
#
# Setup (one-time, manual):
#
#   1. Create the release repo at
#      https://github.com/hussienessam04/colonoscopist-releases
#      (must be PUBLIC so end users can fetch updates via
#      electron-updater).
#
#   2. Generate a GitHub PAT with `repo` scope on the `hussienessam04`
#      account. Cross-repo publish needs a token (the default
#      GITHUB_TOKEN only writes to the same repo).
#
#   3. Add the PAT as a repository secret named `RELEASE_TOKEN` in
#      this `colonoscopist` repo (Settings → Secrets and variables
#      → Actions → New repository secret).
#
# Workflow triggers:
#   - On push of any tag matching `v*` (e.g. v0.1.3)
#   - Manual dispatch (workflow_dispatch) for ad-hoc rebuilds
#
# Outputs (uploaded as GitHub Release assets to colonoscopist-releases):
#   - Colonoscopist Setup X.Y.Z.exe (NSIS installer)
#   - Colonoscopist Setup X.Y.Z.exe.blockmap (delta updates)
#   - Colonoscopist X.Y.Z.exe (portable)
#   - latest.yml (used by electron-updater at runtime to detect releases)

name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.3). Leave blank to use the latest pushed tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Quick task 260913-rp5 — the postinstall script runs electron-rebuild
      # + better-sqlite3 native bindings. Without it the built installer's
      # IPC handlers would crash on the first SQLite call.
      - name: Rebuild native deps for Electron
        run: npm run postinstall
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      # Quick task 260913-rp5 --publish never so the implicit CI
      # detection in electron-builder doesn't try to auto-publish
      # with the default (broken) GITHUB_TOKEN. The script step
      # below owns publishing with the RELEASE_TOKEN PAT.
      - name: Build installer + portable
        run: npm run build:installers

      - name: Determine release tag
        id: tag
        # Quick task 260913-rp5: Git Bash on windows-latest is dash-flavored
        # and rejects bash-4 `${VAR:-default}` with `bad substitution`.
        # POSIX-only `[ -n "$VAR" ]` works in both Git Bash and core bash.
        #
        # Read `inputs.tag` via an env-var passthrough on the step's
        # `env:` block — embedding `${{ inputs.tag }}` directly inside
        # the bash multi-line `run:` was producing a hard-to-debug
        # empty substitution in the prior iteration (see run 34870011279).
        shell: bash
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUTS_TAG" ]; then
            TAG="$INPUTS_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Cross-repo publish to colonoscopist-releases via gh CLI.
      # The `GH_TOKEN` env var is what `gh` uses for auth — set to
      # the cross-repo PAT so we land assets on the right repo.
      # `gh release create` idempotently skips creating if the tag
      # exists, and `gh release upload --clobber` overwrites assets
      # of the same name (lets us re-run on the same tag).
      #
      # `shell: bash` is mandatory — the script uses POSIX features
      # (arrays, `set -euo pipefail`, `[[ -n ... ]]`) that PowerShell
      # can't parse. Without it, windows-latest falls back to
      # pwsh.EXE which throws `Missing '(' after 'if'`.
      - name: Publish to colonoscopist-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          DEST=hussienessam04/colonoscopist-releases

          echo "Publishing Colonoscopist ${TAG} → ${DEST}"

          # Build the file list for `gh release create`. Glob order
          # is alphabetical so the NSIS (Setup) lands before the
          # portable in the asset list.
          shopt -s nullglob
          ASSETS=( dist/*.exe dist/*.exe.blockmap dist/latest*.yml )
          shopt -u nullglob
          echo "Assets to upload:"
          printf '  %s\n' "${ASSETS[@]}"

          # Create-or-update the release. `gh release create` is the
          # right primitive for creating + uploading in one step;
          # we use `--draft false` so it publishes immediately.
          # If the release already exists on the target repo (idempotent
          # retry), fall back to `gh release upload --clobber`.
          if gh release view "$TAG" --repo "$DEST" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on ${DEST}; uploading assets to existing release."
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$DEST" --clobber
          else
            gh release create "$TAG" \
              --repo "$DEST" \
              --title "Colonoscopist ${TAG}" \
              --notes "Colonoscopist ${TAG} — Windows NSIS installer, portable build, and latest.yml manifest.

          See CHANGELOG.md / commit messages for detailed changes." \
              "${ASSETS[@]}"
          fi

          echo "Published: https://github.com/${DEST}/releases/tag/${TAG}"
          # Mark the workflow run with the release URL via a step summary.
          echo "## Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://github.com/${DEST}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
